name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 是 package.json engines 声明的下限（pnpm 11 要求 Node >=22.13），
        # 24 是当前主流版本。下限必须真的被跑到，否则声明只是一句没人验证的话。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # 版本取自 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
