[workspace]
resolver = "3"
# AttaCore 是一个**自己的 workspace**，以子模块的形式在 vendor/attacore 下。
# 不排除掉的话 cargo 会试着把它的 21 个 crate 吸进这个 workspace。
exclude = ["vendor/attacore"]
members = ["crates/xops-core", "crates/xops-store", "crates/xops-audit", "crates/xops-identity", "crates/xops-mcp", "crates/xops-table", "crates/xops-read", "crates/xops-web", "crates/xops-exec", "crates/xops-repo", "crates/xops-skill", "crates/xops-task", "crates/xops-dispatch", "crates/xops-flow", "crates/xops-settle", "crates/xops-script", "crates/xops-notice", "crates/xops-template", "crates/xops-xforge", "crates/xopsd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/openatta/XOps"

[workspace.dependencies]
xops-core = { path = "crates/xops-core" }
xops-store = { path = "crates/xops-store" }
xops-audit = { path = "crates/xops-audit" }
xops-identity = { path = "crates/xops-identity" }
xops-mcp = { path = "crates/xops-mcp" }
xops-table = { path = "crates/xops-table" }
xops-read = { path = "crates/xops-read" }
xops-exec = { path = "crates/xops-exec" }
xops-repo = { path = "crates/xops-repo" }
xops-settle = { path = "crates/xops-settle" }
xops-skill = { path = "crates/xops-skill" }
xops-task = { path = "crates/xops-task" }
xops-flow = { path = "crates/xops-flow" }
xops-script = { path = "crates/xops-script" }
xops-notice = { path = "crates/xops-notice" }
xops-template = { path = "crates/xops-template" }
xops-xforge = { path = "crates/xops-xforge" }
xops-dispatch = { path = "crates/xops-dispatch" }
xops-web = { path = "crates/xops-web" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rusqlite 只允许出现在 xops-store 里。CON-012 的分界线就在这一行 ——
# 见 crates/xops-store/tests/no_sqlite_outside_store.rs，它会枚举全仓来证明这件事。
rusqlite = { version = "0.40", features = ["bundled"] }
# 令牌：32 字节 CSPRNG 取原文，SHA-256 存摘要（TOK-002 不可逆）。
getrandom = "0.3"
sha2 = "0.10"
# 只读仓凭据是**可逆**加密（拉取时要用原文），与令牌的单向摘要不是一回事。
chacha20poly1305 = "0.10"
# 插件载体（D52）：一次调用一个 runtime，默认零宿主绑定。
rquickjs = { version = "0.12", features = ["bindgen"] }
# 执行引擎（D61）：**以库的形式嵌进来，一个进程**。
# 路径指向子模块，版本由子模块的 commit 定死 —— 见 .gitmodules。
attacore-runtime = { package = "runtime", path = "vendor/attacore/crates/runtime" }
attacore-model = { package = "model", path = "vendor/attacore/crates/model" }
attacore-scene = { package = "scene", path = "vendor/attacore/crates/scene" }
attacore-core = { package = "base", path = "vendor/attacore/crates/core" }
# 嵌了 AttaCore 就把 tokio 一起带进来了。
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
# 只给 xopsd 用：捕 SIGTERM / SIGINT。
# std 里没有信号 API，而自己写要 `unsafe`，那是 forbid 的 —— 所以引一个。
signal-hook = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
