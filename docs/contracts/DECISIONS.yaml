# 破坏性契约变更的具名人拍板台账。
#
# 字段名与 XForge 的 evidence/conditions/contractDecisions.yaml 完全一致，
# 接进去时是改路径不是改内容。四个字段是硬编码的，没有别名：
#   question / decision / decidedBy / decidedAt
#
# decidedBy 写 Git author（xbitsmaster），decidedAt 用 ISO 8601。
# 一开始就写真实身份：将来接 XForge 时它要与从提交历史建起来的比对集合对得上，
# 事后改，改的是一条已经被引用过的决策。见 README §7。
#
# entries: [] 是一条断言——"本仓当前没有待拍板的破坏性契约变更"，不是空文件。
condition: contractDecisions
entries:
  - id: cbc-plugin-readtable-page
    question: >-
      给插件的 xops.readTable 接游标，回话从一个数组变成 {rows, next}。
      这会打断已安装的、声明了读表能力的输出插件——要不要走 expand-contract
      （加一个新函数名，旧的留一个发布周期）？
    decision: >-
      直接改，不走 expand-contract。本仓还没有部署，已安装插件数为零，
      加一个并行的函数名换回的只是两个做同一件事的绑定。
      ⚠️ 真有存量之后这条不再成立：那时正确的做法是加新名字而不是改这个——
      因为插件版本不可变（PLG-009），改了要重新生成候选再装一次，
      而那是维护者的一次人工动作，不该由平台升级替他决定。
    decidedBy: xbitsmaster
    decidedAt: 2026-09-01T00:00:00Z

  - id: cbc-platform-webhook-secret
    question: >-
      Git webhook 的验签密钥从平台级一把（XOPS_WEBHOOK_SECRET）改为按项目一把
      （存在仓绑定上，经 repo.webhook-secret 设）。要不要留一个过渡期——
      两把都认，平台级那把打一条弃用日志，下一个版本再删？
    decision: >-
      直接删，不留过渡期。留着它等于留着那条错的路：一个部署只要还设着它，
      webhook 的作用面就还是全平台，而那正是要修的东西——
      **一把能给每一个项目投递事件的密钥，守的却是一个无凭据的公网入口**。
      过渡期在这里不是稳妥，是把风险窗口按发布周期延长。
      ⚠️ 代价是明确的：设过那个变量的部署升上来之后 webhook 一律回"不存在"，
      直到每个项目各设一把。**静默地继续按旧口径投递比停掉更糟**，所以选停掉。
    decidedBy: xbitsmaster
    decidedAt: 2026-09-01T00:00:00Z

  - id: cbc-drop-attacore-socket-engine
    question: >-
      删掉 rust:xops-exec#AttaCoreEngine（走 Unix socket 连 attacored 的那条执行后端）。
      D61 之后引擎以库的形式嵌在同一个进程里，这条路没有接进任何部署；
      但它是 xops-exec 的公开类型，删掉是一次破坏性契约变更。
      要不要留着当「将来跨机器执行」的现成实现？
    decision: >-
      删。留着比没有更糟——它**从来没有和一个真的 attacored 说过话**：
      按一个想象中的回话格式写成，读 /result/text 与 /result/usage/total_tokens，
      而真实守护进程的 run_turn 最终响应里两样都没有（正文与用量只在 session.event
      事件流里）。后果是**产出恒为空串、token 恒为 0，两样都不报错**。
      同一处还有三样：过程记录原样收下事件帧因而含模型回话原文（违 I-F）、
      读超时 30 秒而派工单给 15 分钟（健康但慢的执行会被杀掉并误报）、
      会话建了从不 close（堆在 daemon 的池子里，transcript 无 GC）。
      ⚠️ 它唯一的测试用的是一个**回话形状照着我们的假设写的**假 daemon，
      于是那条测试证明的是"客户端与它自己的假设一致"——它绿了，而且会一直绿。
      **一份能编译、有测试、看着完整的死代码，比一个空白的 trait 更容易被信任。**
      真要跨机器执行的那天，照着现在的协议文档重写比修它快，且不继承这四处假设。
      **保留的是能力不是实现**：Engine 仍是 trait、StubEngine 仍在、
      Engine::healthy 那个口子仍在（EXE-030 对任何进程外实现照样成立），换后端不改一行。
      ⚠️ 删之前先接住了一样东西：TSK-005 的单次 token 上限**只在这条死路上比过一次**，
      嵌入式那条路上一次都没比过。判定已搬到 Runtime 上（与引擎无关，桩引擎也成立）。
    decidedBy: xbitsmaster
    decidedAt: 2026-09-05T00:00:00Z

